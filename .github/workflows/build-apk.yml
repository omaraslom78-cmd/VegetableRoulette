name: Build Vegetable Roulette APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q VegetableRouletteAndroid_CloudBuild.zip -d source

      - name: Build APK
        run: gradle -p source/VegetableRouletteAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Vegetable-Roulette-APK
          path: source/VegetableRouletteAndroid/app/build/outputs/apk/debug/app-debug.apk
